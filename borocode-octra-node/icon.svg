<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00aa33" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1a331a" stroke-width="8"/>

  <!-- Outer FHE Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#004411" stroke-width="4" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neon-grad)" stroke-width="6" opacity="0.6"/>

  <!-- Octagon / Cipher Core Geometry -->
  <polygon points="256,96 369,143 416,256 369,369 256,416 143,369 96,256 143,143" 
           fill="none" stroke="url(#neon-grad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Internal Node Intersection -->
  <polygon points="256,150 331,181 362,256 331,331 256,362 181,331 150,256 181,181" 
           fill="#041208" stroke="#00ff66" stroke-width="4"/>

  <!-- Central Quantum Pulse -->
  <circle cx="256" cy="256" r="28" fill="#00ff66" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
