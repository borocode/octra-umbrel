  Octra is a breakthrough Layer 1 blockchain powered by Hypergraph Fully Homomorphic Encryption (HFHE).

  The Octra Suite for Umbrel provides an all-in-one sovereign hub combining consensus validation, private wallet management, and smart contract development directly on your personal server:

  🔵 Consensus Node: Runs a sovereign observer & validator node connected to Devnet (octra-devnet-9871-cluster), benchmarking confidential FHE circuits and validating live epochs.

  👛 Web Wallet & FHE Engine: Encrypted keystore, balance tracking, confidential transactions, and stealth address payments powered by PVAC-HFHE.

  ⚙️ Circles IDE: Interactive smart contract development environment with pre-built AML templates for AMMs, Tokens, Escrows, Vaults, and Multisig.

  🔒 FHE Cipher & Swap: Inspect homomorphic ciphertext structures and test token swaps.

  🔑 Key Generator: Client-side offline 24-word BIP39 mnemonic and Bech32 address generation.
