description: >-
  Octra is a breakthrough Layer 1 blockchain powered by Hypergraph Fully Homomorphic Encryption (HFHE).

  The Octra Lite Node allows you to run an observer and validator node directly from your Umbrel server, contributing sovereign compute to decentralized consensus and confidential computation.

  📡 Network Status:
  This package currently connects to the active Octra Devnet Cluster (octra-devnet-9871-cluster), the public proving ground where community nodes benchmark homomorphic encryption circuits, verify zero-knowledge range proofs (PVAC), and stress-test P2P consensus gossip.

  💎 Why Run an Octra Node?
  - Help test and secure the next generation of private, encrypted smart contracts on commodity hardware.
  - Zero configuration: Automatically initializes keys, syncs state, and tracks live consensus epochs.
  - Built-in real-time Web Telemetry Dashboard to monitor node health and validator status.
  - Ready for future mainnet validator set expansion directly through Umbrel updates.
